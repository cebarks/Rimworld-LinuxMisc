name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install native build and archive tools
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils zip

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run regression suites
        run: just test

      - name: Build release archive
        run: just release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: LinuxMisc-*.zip
          generate_release_notes: true

      - name: Extract mod files for Steam
        run: |
          VERSION=$(git describe --tags --always --dirty)
          unzip "LinuxMisc-${VERSION}.zip" -d steam-upload
          mv steam-upload/LinuxMisc steam-upload/mod

      - name: Prepare Workshop manifest
        id: workshop_manifest
        run: python3 scripts/prepare_workshop.py steam-upload/mod steam-upload/workshop_item.vdf

      - name: Upload to Steam Workshop
        timeout-minutes: 20
        uses: buildalon/upload-steam@v1
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          config: ${{ secrets.STEAM_CONFIG }}
          workshop_item: steam-upload/workshop_item.vdf

      - name: Preserve Workshop upload result
        if: ${{ always() && steps.workshop_manifest.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: workshop-manifest-${{ github.ref_name }}-${{ github.run_attempt }}
          path: steam-upload/workshop_item.vdf
          if-no-files-found: error
